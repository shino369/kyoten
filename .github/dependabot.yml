version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Match minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      playwright:
        patterns:
          - 'playwright'
          - '@playwright/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
    ignore:
      # Track the minimum supported Node.js major in package.json (engines.node >=24).
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns:
          - '*'
