name: Bug report
description: Report a bug or unexpected behavior in kyoten
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! For security vulnerabilities, please use [Private Vulnerability Reporting](https://github.com/shino369/kyoten/security/advisories/new) instead of a public issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands or actions to reproduce the issue.
      placeholder: |
        1. Run `...`
        2. Observe `...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - WSL
        - Other
    validations:
      required: true

  - type: checkboxes
    id: harness
    attributes:
      label: Affected harness / CLI
      description: Select all that apply.
      options:
        - label: Claude Code (`claude`)
        - label: Codex (`codex`)
        - label: Antigravity CLI (`agy`)
        - label: DeepSeek Harness (`dsh`)
        - label: DeepSeek via Claude Code (`dscc`)
        - label: Standalone / `kyoten` CLI or workspace scripts

  - type: textarea
    id: environment
    attributes:
      label: Environment & diagnostic output
      description: Include Node.js/pnpm versions, kyoten version or commit SHA, and output from `kyoten doctor` or `pnpm workspace:check`. Never paste real API keys or secrets.
      render: shell
